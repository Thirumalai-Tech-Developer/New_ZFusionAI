<!DOCTYPE html>
<html lang="en-AE" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030c07" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="author" content="ZFusionAI" />
    <meta name="application-name" content="ZFusionAI" />

    <!--
      Per-route SEO tags (title, description, canonical, Open Graph, Twitter,
      robots) are injected here at build time by seo-prerender.ts and then
      managed client-side by <SeoHead />.
    -->
    <!--seo-head-->

    <!-- GEO -->
    <meta name="geo.region" content="AE-DU" />
    <meta name="geo.placename" content="Dubai, United Arab Emirates" />
    <meta name="geo.position" content="25.2048;55.2708" />
    <meta name="ICBM" content="25.2048, 55.2708" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons & PWA -->
    <link rel="icon" type="image/png" href="/brand/logo_compressed.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- AI / LLM discovery (GEO) -->
    <link rel="alternate" type="text/markdown" title="LLM summary" href="/llms.txt" />

    <link rel="preload" as="image" href="/brand/logo_compressed.png" />

    <!-- Organization structured data (static copy for non-JS crawlers) -->
    <script type="application/ld+json" data-seo-static>
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "ProfessionalService"],
        "@id": "https://zfusionai.com/#organization",
        "name": "ZFusionAI",
        "url": "https://zfusionai.com/",
        "logo": "https://zfusionai.com/brand/icon-512.png",
        "image": "https://zfusionai.com/brand/og-image.png",
        "description": "Dubai, UAE company building WhatsApp AI automation on the official Cloud API (free trial with 1,000 messages), autonomous AI agents and full-stack web platforms.",
        "telephone": "+971 54 202 6653",
        "email": "support@zfusionai.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Downtown Dubai",
          "addressLocality": "Dubai",
          "addressRegion": "Dubai",
          "addressCountry": "AE"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 25.2048, "longitude": 55.2708 },
        "areaServed": ["AE", "GCC", "Worldwide"],
        "sameAs": [
          "https://github.com/Thirumalai-Tech-Developer/New_ZFusionAI",
          "https://www.linkedin.com/company/zfusionai",
          "https://www.instagram.com/zfusionai"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+971 54 202 6653",
          "contactType": "sales",
          "availableLanguage": ["English", "Arabic"]
        }
      }
    </script>
  </head>

  <body>
    <div id="root"><!--seo-body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
